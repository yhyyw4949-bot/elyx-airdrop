<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ELYX Admin</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <header class="brand">
      <span class="mark">E</span>
      <h1>ELYX Admin</h1>
      <div class="phase-banner-wrap">
        <span id="phase-banner" class="phase-banner"></span>
      </div>
    </header>

    <section class="card" id="locked" hidden>
      <p>This panel is for campaign admins only.</p>
    </section>

    <div id="panel" hidden>
      <section class="card">
        <h2>Stats</h2>
        <div class="stat-grid">
          <div class="stat"><span id="st-total">0</span><label>users</label></div>
          <div class="stat"><span id="st-whitelisted">0</span><label>whitelisted</label></div>
          <div class="stat"><span id="st-wallets">0</span><label>wallets</label></div>
          <div class="stat"><span id="st-referred">0</span><label>via referral</label></div>
        </div>
      </section>

      <section class="card">
        <h2>Campaign phase</h2>
        <div class="phase-buttons">
          <button class="btn small phase-btn" data-phase="1">1 Whitelist</button>
          <button class="btn small phase-btn" data-phase="2">2 Points</button>
          <button class="btn small phase-btn" data-phase="3">3 Conversion</button>
          <button class="btn small phase-btn" data-phase="4">4 Airdrop</button>
        </div>
      </section>

      <section class="card">
        <h2>Whitelist requests</h2>
        <div class="row">
          <button id="approve-all" class="btn small primary">Approve all</button>
          <button id="refresh-wl" class="btn small">Refresh</button>
        </div>
        <table id="whitelist-table">
          <thead><tr><th>User</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
        <p id="whitelist-empty" class="muted" hidden>No pending requests.</p>
      </section>

      <section class="card">
        <h2>Members</h2>
        <div class="row">
          <button id="export" class="btn small primary">Export CSV</button>
          <button id="refresh-users" class="btn small">Refresh</button>
        </div>
        <div class="table-wrap">
          <table id="users-table">
            <thead><tr><th>User</th><th>Points</th><th>ELYX</th><th>Wallet</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </div>

    <p id="toast" class="toast" hidden></p>
  </main>
  <script src="admin.js"></script>
</body>
</html>
